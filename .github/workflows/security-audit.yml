name: Security Audit

# Supply-chain checks: cargo-deny (advisories / licenses / sources / bans)
# and cargo-audit (RustSec advisory DB). Runs on every PR and push to main
# so a new transitive dep cannot land without being scanned, and daily on
# cron so newly published advisories are noticed even when no code changes.
on:
  schedule:
    - cron: '0 6 * * *'  # Daily 06:00 UTC — new RustSec advisories land any day.
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger

env:
  CARGO_TERM_COLOR: always

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2

      - name: Install cargo-audit & cargo-deny
        uses: taiki-e/install-action@d858f8113943481093e02986a7586a4819a3bfd6 # v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Run cargo-deny (advisories / licenses / sources / bans)
        # Ignores and skip-trees live in deny.toml so a single source of
        # truth governs both local and CI runs. Bans now fail CI on
        # unexplained duplicate crates and wildcard version requirements
        # — exceptions are documented inline in deny.toml.
        run: cargo deny check

      - name: Run cargo-audit (CVE check)
        # Ignored advisories — review quarterly (last reviewed 2026-05-07).
        # Keep this list in sync with the `ignore` block in deny.toml:
        #   RUSTSEC-2023-0071: rsa crate Marvin Attack — no fix available yet
        #   RUSTSEC-2026-0042: aws-lc-fips-sys — optional FIPS backend, update pending
        #   RUSTSEC-2026-004[4-8]: aws-lc-sys — transitive via optional aws-lc-rs
        #   RUSTSEC-2026-0049: rustls-webpki — daemon TLS dep, update pending
        #   RUSTSEC-2026-009[8-9]: rustls-webpki — daemon TLS dep, update pending
        #   RUSTSEC-2026-0104: rustls-webpki — daemon TLS dep, update pending
        #   RUSTSEC-2025-0134: rustls-pemfile — daemon TLS dep, update pending
        run: >-
          cargo audit
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2026-0042
          --ignore RUSTSEC-2026-0044
          --ignore RUSTSEC-2026-0045
          --ignore RUSTSEC-2026-0046
          --ignore RUSTSEC-2026-0047
          --ignore RUSTSEC-2026-0048
          --ignore RUSTSEC-2026-0049
          --ignore RUSTSEC-2026-0098
          --ignore RUSTSEC-2026-0099
          --ignore RUSTSEC-2026-0104
          --ignore RUSTSEC-2025-0134
